<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TaskBuddy - Add Task</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-container": "#ffa08b",
                        "secondary-container": "#ffdbcb",
                        "on-error-container": "#65000b",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed-variant": "#1e6161",
                        "surface-container": "#f7f3eb",
                        "on-secondary": "#ffffff",
                        "background": "#fffbff",
                        "primary-container": "#a9e8e8",
                        "primary-fixed-dim": "#9bdada",
                        "on-primary-fixed": "#004344",
                        "surface-dim": "#e6e3d5",
                        "on-primary-container": "#105758",
                        "surface-container-high": "#f1eee4",
                        "inverse-surface": "#0f0e0c",
                        "on-secondary-container": "#81401b",
                        "surface-tint": "#2e6e6e",
                        "on-background": "#393830",
                        "secondary-fixed-dim": "#ffc9b0",
                        "error-container": "#f56965",
                        "on-tertiary-container": "#632012",
                        "on-surface-variant": "#66655c",
                        "surface-bright": "#fffbff",
                        "outline-variant": "#bcb9af",
                        "tertiary": "#9e4c3a",
                        "on-tertiary": "#ffffff",
                        "primary-dim": "#1f6162",
                        "tertiary-fixed": "#ffa08b",
                        "on-secondary-fixed": "#692e0a",
                        "primary-fixed": "#a9e8e8",
                        "inverse-primary": "#b7f7f6",
                        "on-surface": "#393830",
                        "error": "#b33938",
                        "on-tertiary-fixed": "#450a01",
                        "secondary-dim": "#894621",
                        "surface-container-low": "#fdf9f2",
                        "surface": "#fffbff",
                        "surface-container-highest": "#ece8dd",
                        "on-primary": "#ffffff",
                        "primary": "#2e6e6e",
                        "outline": "#828177",
                        "secondary": "#98522c",
                        "error-dim": "#70030f",
                        "tertiary-fixed-dim": "#f4917b",
                        "surface-variant": "#ece8dd",
                        "on-tertiary-fixed-variant": "#6f291a",
                        "on-secondary-fixed-variant": "#8d4924",
                        "tertiary-dim": "#8f4130",
                        "secondary-fixed": "#ffdbcb",
                        "inverse-on-surface": "#9f9c98",
                        "on-error": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Plus Jakarta Sans"],
                        "body": ["Plus Jakarta Sans"],
                        "label": ["Plus Jakarta Sans"]
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .task-bubble {
            border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center">
<!-- Blurred Background Overlay representing the Main UI -->
<div class="fixed inset-0 z-0 bg-surface-dim overflow-hidden p-8 flex flex-col gap-6">
<header class="flex justify-between items-center px-6 py-4 w-full bg-[#fffbff]/80 backdrop-blur-xl rounded-2xl">
<h1 class="text-[#393830] font-bold text-lg tracking-tight">Hello, Sarah!</h1>
<span class="material-symbols-outlined text-[#2e6e6e]">notifications</span>
</header>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6 opacity-30">
<div class="h-48 bg-surface-container rounded-3xl p-6">
<div class="w-1/3 h-4 bg-outline-variant rounded-full mb-4"></div>
<div class="w-2/3 h-8 bg-on-surface-variant rounded-full"></div>
</div>
<div class="h-48 bg-surface-container-high rounded-3xl p-6">
<div class="w-1/4 h-4 bg-outline-variant rounded-full mb-4"></div>
<div class="w-1/2 h-8 bg-on-surface-variant rounded-full"></div>
</div>
</div>
</div>
<!-- Modal Backdrop -->
<div class="fixed inset-0 z-40 bg-on-surface/10 backdrop-blur-sm"></div>
<!-- Add Task Screen (Modal-like) -->
<main class="relative z-50 w-full max-w-lg mx-4">
<div class="bg-surface-container-lowest rounded-[2.5rem] shadow-[0_24px_48px_-12px_rgba(57,56,48,0.12)] p-8 md:p-10 flex flex-col gap-8">
<!-- Header -->
<div class="flex justify-between items-start">
<div>
<h2 class="text-3xl font-extrabold text-on-surface tracking-tight mb-1">New Task</h2>
<p class="text-on-surface-variant text-sm font-medium">Create a moment of focus</p>
</div>
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-high text-on-surface hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Form Content -->
<div class="flex flex-col gap-8">
<!-- Task Name Input -->
<div class="flex flex-col gap-2">
<label class="font-label text-xs font-semibold uppercase tracking-[0.1em] text-on-surface-variant ml-1">Task Name</label>
<input class="w-full bg-surface-container-high border-none rounded-2xl p-5 text-lg font-medium placeholder:text-outline focus:ring-2 focus:ring-primary/20 transition-all" placeholder="What needs to be done?" type="text"/>
</div>
<!-- Category Selection -->
<div class="flex flex-col gap-4">
<label class="font-label text-xs font-semibold uppercase tracking-[0.1em] text-on-surface-variant ml-1">Category</label>
<div class="flex flex-wrap gap-4">
<!-- Work -->
<div class="flex items-center gap-3 bg-primary-container/30 border-2 border-primary/20 px-5 py-3 rounded-full cursor-pointer hover:bg-primary-container transition-colors">
<div class="task-bubble w-8 h-8 bg-primary flex items-center justify-center text-white">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">work</span>
</div>
<span class="font-semibold text-on-primary-container">Work</span>
</div>
<!-- Personal -->
<div class="flex items-center gap-3 bg-surface-container-high px-5 py-3 rounded-full cursor-pointer hover:bg-surface-container-highest transition-colors">
<div class="task-bubble w-8 h-8 bg-secondary flex items-center justify-center text-white">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
<span class="font-semibold text-on-surface">Personal</span>
</div>
<!-- Health -->
<div class="flex items-center gap-3 bg-surface-container-high px-5 py-3 rounded-full cursor-pointer hover:bg-surface-container-highest transition-colors">
<div class="task-bubble w-8 h-8 bg-tertiary flex items-center justify-center text-white">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">fitness_center</span>
</div>
<span class="font-semibold text-on-surface">Health</span>
</div>
</div>
</div>
<!-- Date and Time Grid -->
<div class="grid grid-cols-2 gap-6">
<div class="flex flex-col gap-2">
<label class="font-label text-xs font-semibold uppercase tracking-[0.1em] text-on-surface-variant ml-1">Date</label>
<div class="flex items-center gap-3 bg-surface-container-high rounded-2xl p-4 cursor-pointer">
<span class="material-symbols-outlined text-primary">calendar_today</span>
<span class="font-medium text-on-surface">Mar 24, 2024</span>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label text-xs font-semibold uppercase tracking-[0.1em] text-on-surface-variant ml-1">Time</label>
<div class="flex items-center gap-3 bg-surface-container-high rounded-2xl p-4 cursor-pointer">
<span class="material-symbols-outlined text-primary">schedule</span>
<span class="font-medium text-on-surface">10:30 AM</span>
</div>
</div>
</div>
<!-- Priority Selection -->
<div class="flex flex-col gap-2">
<label class="font-label text-xs font-semibold uppercase tracking-[0.1em] text-on-surface-variant ml-1">Priority</label>
<div class="grid grid-cols-3 gap-3 p-1.5 bg-surface-container-high rounded-2xl">
<button class="py-2.5 rounded-xl font-bold text-sm bg-surface-container-lowest shadow-sm text-on-surface">Low</button>
<button class="py-2.5 rounded-xl font-bold text-sm text-outline hover:text-on-surface transition-colors">Medium</button>
<button class="py-2.5 rounded-xl font-bold text-sm text-outline hover:text-on-surface transition-colors">High</button>
</div>
</div>
</div>
<!-- Create Button -->
<button class="mt-4 w-full bg-gradient-to-br from-primary to-primary-dim text-on-primary py-5 rounded-full font-bold text-lg shadow-[0_12px_24px_-8px_rgba(46,110,110,0.4)] hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-3">
<span class="material-symbols-outlined">add_task</span>
                Create Task
            </button>
</div>
</main>
<!-- Shared Navigation Shell - Fixed at bottom for Mobile Context -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-8 pb-6 pt-3 bg-[#fdf9f2] rounded-t-[2rem] shadow-[0_-4px_24px_rgba(57,56,48,0.04)] md:hidden">
<div class="flex flex-col items-center justify-center text-[#393830]/50 p-3 hover:bg-[#ece8dd] transition-colors">
<span class="material-symbols-outlined">home</span>
</div>
<div class="flex flex-col items-center justify-center text-[#393830]/50 p-3 hover:bg-[#ece8dd] transition-colors">
<span class="material-symbols-outlined">assignment_turned_in</span>
</div>
<!-- Active Tab: New Task fits logic for Task focus, but since we are in a modal, let's keep nav subtle -->
<div class="flex flex-col items-center justify-center bg-[#2e6e6e] text-white rounded-full p-3 scale-95">
<span class="material-symbols-outlined">calendar_today</span>
</div>
<div class="flex flex-col items-center justify-center text-[#393830]/50 p-3 hover:bg-[#ece8dd] transition-colors">
<span class="material-symbols-outlined">query_stats</span>
</div>
</nav>
</body></html>
