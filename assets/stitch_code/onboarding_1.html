<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .soft-mask {
            mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-surface min-h-screen flex flex-col overflow-hidden">
<!-- Suppressing Shared Nav Shells for Onboarding per "The Filter" Rule -->
<!-- Header Action -->
<header class="w-full flex justify-end px-8 py-10">
<button class="text-on-surface-variant font-semibold tracking-wide hover:text-primary transition-colors">
            Skip
        </button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-8 text-center">
<!-- Illustration Area (Hero) -->
<div class="relative w-full max-w-md aspect-square flex items-center justify-center mb-12">
<!-- Background Blob -->
<div class="absolute inset-0 bg-surface-container-low rounded-full scale-110 blur-3xl opacity-60"></div>
<!-- Main Illustration -->
<div class="relative z-10 w-full h-full flex items-center justify-center">
<img alt="Mindful Management illustration" class="w-full h-full object-contain drop-shadow-xl" data-alt="Soft painterly illustration of a serene person calmly arranging glowing floating icons of a calendar, clock, and checkmark in a warm teal and cream atmosphere" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDAgpaollKqaz_O8QX3rR6UC0by2o74mro0EcGUPUinmnKusqStqNYBlpwq9bicfCBcB_1QsZ74W8gYdSxPwY4s1p3vGqNpo69XQ8o_FcTJxbSWjRTIj-VIr1QWIb3lzEeRGwGxyvAUf4vm7wOIScl3Bsmlq0zPJPgstk8cvI-xjsEVltQepZbU5KG7eLrd779K0H81sGnvJAELwUZFthhAf7UePyeZVrkevl0O5qYI2qxpxPrxRKomS40bworrDNn1qrpAAft9s-M"/>
<!-- Floating Decorative Icons (The Task Bubbles) -->
<div class="absolute top-[15%] left-[20%] w-14 h-14 bg-primary-container text-on-primary-container rounded-full flex items-center justify-center shadow-lg animate-pulse" style="animation-duration: 4s;">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">calendar_today</span>
</div>
<div class="absolute top-[25%] right-[15%] w-16 h-16 bg-secondary-container text-on-secondary-container rounded-full flex items-center justify-center shadow-lg animate-pulse" style="animation-duration: 5s;">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">schedule</span>
</div>
<div class="absolute bottom-[20%] left-[25%] w-12 h-12 bg-tertiary-container text-on-tertiary-container rounded-full flex items-center justify-center shadow-lg animate-pulse" style="animation-duration: 6s;">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</div>
<!-- Typography Cluster -->
<div class="max-w-xs space-y-6">
<h1 class="text-4xl font-extrabold text-on-surface tracking-tight leading-tight">
                Mindful Management
            </h1>
<p class="text-lg text-on-surface-variant font-medium leading-relaxed">
                Organize your day with intention and clarity, not just a list of chores.
            </p>
</div>
</main>
<!-- Footer Action Area -->
<footer class="w-full px-8 pb-16 flex flex-col items-center space-y-12">
<!-- Progress Dots -->
<div class="flex space-x-3 items-center">
<div class="h-2.5 w-8 rounded-full bg-primary transition-all duration-300"></div>
<div class="h-2.5 w-2.5 rounded-full bg-outline-variant/30 hover:bg-outline-variant transition-all duration-300"></div>
<div class="h-2.5 w-2.5 rounded-full bg-outline-variant/30 hover:bg-outline-variant transition-all duration-300"></div>
</div>
<!-- Primary Action -->
<div class="w-full max-w-sm">
<button class="w-full bg-gradient-to-br from-primary to-primary-dim text-on-primary py-5 rounded-full font-bold text-lg shadow-xl shadow-primary/10 hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 flex items-center justify-center space-x-2">
<span>Next</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</footer>
<!-- Decorative Texture Layer -->
<div class="fixed inset-0 pointer-events-none opacity-[0.03] mix-blend-multiply" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDMdpiZ1iO2R_rxzg2DCAtTg8wbe1hmMFUc9Z6goDNyXLbeW6g4aXKv4g_MVk_LxrvYu3VdmEI0FbDLgp8qSoF_Xxh6h-ScZm_EJV-4uhugcbHFFyu7Y2TIKn6RccXo_wA3YVMO36m24J6YBLdRKKSR5X6puYy10NdOMYGwosIqnuYhlgyO6Wkr_vR4TbsgYt7Ud_zeHiCRESnnPud0au_MQNX4_rfsin6plCoMdufxVGTsQMaAdChZKYwxsWps7TPtphS1DHafDLg');">
</div>
</body></html>
