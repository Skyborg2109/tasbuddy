<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

                        "primary-dim": "#1f6162",

                        "on-secondary-fixed": "#692e0a",
                        "primary-fixed": "#a9e8e8",
                        "inverse-primary": "#b7f7f6",

                        "secondary-dim": "#894621",

                        "on-primary": "#ffffff",
                        "primary": "#2e6e6e",
                        "outline": "#828177",
                        "secondary": "#98522c",
                        "error-dim": "#70030f",
                        "tertiary-fixed-dim": "#f4917b",
                        "surface-variant": "#ece8dd",
                        "on-tertiary-fixed-variant": "#6f291a",
                        "on-secondary-fixed-variant": "#8d4924",

<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fdf9f2; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .soft-shadow {
            box-shadow: 0 8px 32px 0 rgba(57, 56, 48, 0.04);
        }
    </style>
<style>
        body {
          min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-surface-container-low text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar (from COMPONENTS_16) -->
<main class="flex-grow flex items-center justify-center px-6">
<div class="w-full max-w-md">
<!-- Welcome Header -->
<div class="text-center mb-10">
<div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-surface-container-lowest mb-6 shadow-[0_4px_16px_rgba(57,56,48,0.03)]">
<span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 1;">task_alt</span>
</div>
<h1 class="text-4xl font-extrabold text-on-surface tracking-tight mb-2">Welcome back</h1>
<p class="text-on-surface-variant font-medium">Your productivity sanctuary awaits.</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-[2.5rem] p-8 md:p-10 soft-shadow border border-white/50">
<form class="space-y-6">
<!-- Email Input -->
<div class="space-y-2">
<label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant/80 ml-1" for="email">Email address</label>
<div class="relative">
<input class="w-full bg-surface-container-high border-none focus:ring-2 focus:ring-primary/20 rounded-2xl px-5 py-4 text-on-surface placeholder:text-outline/40 transition-all outline-none font-medium" id="email" name="email" placeholder="alex@example.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="text-xs font-bold uppercase tracking-widest text-on-surface-variant/80" for="password">Password</label>
<a class="text-xs font-bold text-primary hover:opacity-70 transition-opacity" href="#">Forgot Password?</a>
</div>
<div class="relative">
<input class="w-full bg-surface-container-high border-none focus:ring-2 focus:ring-primary/20 rounded-2xl px-5 py-4 text-on-surface placeholder:text-outline/40 transition-all outline-none font-medium" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Sign In Button -->
<button class="w-full py-4 bg-primary text-white font-bold rounded-full text-lg shadow-lg hover:opacity-90 active:scale-[0.98] transition-all duration-200" type="submit">
                    Sign In
                </button>
</form>
<!-- Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline/10"></div>
</div>
<div class="relative flex justify-center text-[10px] uppercase tracking-widest font-bold">
<span class="px-4 bg-surface-container-lowest text-outline/60">Or continue with</span>
</div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 py-3.5 bg-surface-container-low border border-outline-variant/10 rounded-full hover:bg-surface-container-high transition-colors active:scale-95 duration-200">
<img alt="Google" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB3R0l5IzgNMMCzVdP0Z-lKU8tdh_NIdij4g6w4ulKkiKVeBxE_xDl22mNixoFxA70I0P309ouZK6H9VKKjWkZWFjfYzQSq0TCeBxhcqrFqdbkHzW6l43VikAC5U2iV1sn6FPAXhh27JbvpBVH1BSO3oinI3R_j-cBhkI95uLdLCsrXO5EGzmIU01X1jOQLNCpiXiRft_m7WxnKd9AsJV40AijJtD63OfSoRGZsMLzEAdL4Zqu0oQZ_u-NGSQ-6IjfIHJjBEQehXyI"/>
<span class="text-sm font-bold text-on-surface">Google</span>
</button>
<button class="flex items-center justify-center gap-2 py-3.5 bg-surface-container-low border border-outline-variant/10 rounded-full hover:bg-surface-container-high transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">apple</span>
<span class="text-sm font-bold text-on-surface">Apple</span>
</button>
</div>
</div>
<!-- Footer Link -->
<p class="text-center mt-8 text-on-surface-variant font-medium">
            Don't have an account? 
            <a class="text-secondary font-bold hover:underline" href="#">Join TaskBuddy</a>
</p>
</div>
</main>
<!-- BottomNavBar (from COMPONENTS_16) -->
<!-- Background Decorative Elements -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none -z-10 overflow-hidden">
<div class="absolute -top-[10%] -left-[5%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[100px]"></div>
<div class="absolute top-[60%] -right-[10%] w-[50%] h-[50%] bg-secondary/5 rounded-full blur-[120px]"></div>
</div>
</body></html>
